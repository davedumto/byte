<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Byte</title>
<style>
  /* Fonts bundled locally (SIL OFL 1.1, see fonts/*-OFL.txt): same faces as the prototype's Google Fonts, Latin subset */
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/Inter-latin.woff2) format('woff2')}
  @font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url(fonts/SpaceGrotesk-latin.woff2) format('woff2')}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;background:#171923;color:#F2EFE8;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  /* the 852 x 480 screen, scaled by fit() in main.js to fill the display */
  #screen{position:absolute;left:0;top:0;width:852px;height:480px;transform-origin:0 0;overflow:hidden;background:#171923}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  .chip{position:absolute;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(20,22,31,.82);border:1px solid rgba(242,239,232,.14);pointer-events:none}
  .dot{width:10px;height:10px;border-radius:50%}
  .bar{width:60px;height:6px;border-radius:3px;background:#2A2D3A;overflow:hidden}
  .bar > div{height:6px;transition:width .4s,background .4s}
  #coords{font-size:12px;color:#B9BCC8;font-variant-numeric:tabular-nums}
  .ctl{width:44px;height:44px;border-radius:12px;border:1px solid rgba(242,239,232,.22);background:rgba(20,22,31,.8);color:#F2EFE8;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:600 13px Inter,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  .ctl:hover{background:rgba(89,240,181,.2)}
  .ctl:focus-visible,.primary:focus-visible{outline:2px solid #59F0B5;outline-offset:2px}
  .pad{position:absolute;left:16px;bottom:16px;display:grid;grid-template-columns:repeat(3,44px);gap:4px}
  .padc{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#6B6F80}
  .right{position:absolute;right:16px;bottom:16px;display:flex;gap:10px;align-items:center}
  .primary{height:44px;padding:0 18px;border-radius:999px;border:none;background:#59F0B5;color:#14161F;font:600 14px Inter,sans-serif;cursor:pointer}
  .bubble{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:440px;max-width:calc(100% - 32px);padding:14px 18px;border-radius:18px;background:#F2EFE8;color:#14161F;display:flex;flex-direction:column;gap:6px}
  .bubble small{font-size:12px;color:#5B5F6E}
  .bubble b{font-size:12px}
  #answer{margin:0;font-size:15px;line-height:1.45;min-height:22px}
  .askbar{position:absolute;left:16px;right:16px;bottom:16px;display:flex;gap:8px;align-items:center}
  .askbar input{flex:1;height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(242,239,232,.22);background:rgba(20,22,31,.9);color:#F2EFE8;font:14px Inter,sans-serif}
  .sr{position:absolute;left:-9999px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#B9BCC8;background:#171923}
  [hidden]{display:none !important}
</style>
</head>
<body>
  <div id="screen">
    <canvas id="gl" aria-label="Byte's 3D room"></canvas>

    <div class="chip" style="left:16px;top:14px">
      <div class="dot" id="moodDot" style="background:#59F0B5"></div>
      <span id="moodLabel" style="font-size:13px;font-weight:600">Happy</span>
      <div class="bar" aria-hidden="true"><div id="energyFill" style="width:70%;background:#59F0B5"></div></div>
    </div>

    <div class="chip" style="right:16px;top:10px;padding:6px 10px 6px 14px;border-radius:14px">
      <span id="coords">x 0.0 · y 0.0 · z +0.6</span>
      <svg width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="Axes gizmo: x, y and z as seen from the camera">
        <line id="gx" x1="22" y1="22" x2="38" y2="22" stroke="#FFB547" stroke-width="2.5" stroke-linecap="round"/>
        <line id="gy" x1="22" y1="22" x2="22" y2="6" stroke="#59F0B5" stroke-width="2.5" stroke-linecap="round"/>
        <line id="gz" x1="22" y1="22" x2="12" y2="34" stroke="#5AA2FF" stroke-width="2.5" stroke-linecap="round"/>
        <text id="gxl" x="38" y="20" font-size="9" font-weight="700" fill="#FFB547">x</text>
        <text id="gyl" x="20" y="6" font-size="9" font-weight="700" fill="#59F0B5">y</text>
        <text id="gzl" x="8" y="40" font-size="9" font-weight="700" fill="#5AA2FF">z</text>
      </svg>
    </div>

    <div id="controlsLayer">
      <div class="pad">
        <div class="padc"></div>
        <button class="ctl" data-dir="back" aria-label="Move back, minus z"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 11 L9 6 L14 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="padc"></div>
        <button class="ctl" data-dir="left" aria-label="Move left, minus x"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4 L6 9 L11 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="padc">x z</div>
        <button class="ctl" data-dir="right" aria-label="Move right, plus x"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4 L12 9 L7 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="padc"></div>
        <button class="ctl" data-dir="fwd" aria-label="Move forward, plus z"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 7 L9 12 L14 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="padc"></div>
      </div>
      <div class="right">
        <button class="ctl" id="jumpBtn" style="width:76px" aria-label="Jump, plus y">Jump</button>
        <button class="primary" id="askBtn">Ask Byte</button>
      </div>
    </div>

    <div id="askLayer" hidden>
      <div class="bubble" aria-live="polite">
        <small id="youAsked"></small>
        <b>Byte</b>
        <p id="answer"></p>
      </div>
      <form class="askbar" id="askForm">
        <label for="q" class="sr">Ask Byte a question</label>
        <input id="q" type="text" placeholder="Ask Byte anything" autocomplete="off">
        <button class="primary" type="submit">Send</button>
        <button class="ctl" type="button" id="closeAsk" aria-label="Close question"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4 L12 12 M12 4 L4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </form>
    </div>

    <div id="loading">Waking Byte up…</div>
  </div>
<script>
/* Device diagnostics, testing only (?fps): reports boot, WebGL info and JS errors to the dev server log. Draws nothing. */
(function () {
  if (!/[?&]fps(&|=|$)/.test(location.search)) return;
  function report(path, data) {
    var q = Object.keys(data).map(function (k) { return k + '=' + encodeURIComponent(String(data[k]).slice(0, 300)); }).join('&');
    try { fetch(path + '?' + q, { cache: 'no-store' }).catch(function () {}); } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    report('/__err', { msg: e.message, src: (e.filename || '').split('/').pop(), line: e.lineno, col: e.colno });
  });
  window.addEventListener('unhandledrejection', function (e) { report('/__err', { msg: 'promise: ' + (e.reason && e.reason.message || e.reason) }); });
  var gl = null;
  try { var c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) {}
  report('/__boot', {
    ua: navigator.userAgent, dpr: window.devicePixelRatio, vw: innerWidth, vh: innerHeight,
    webgl: gl ? (gl instanceof (window.WebGL2RenderingContext || function () {}) ? 'webgl2' : 'webgl1') : 'none',
    standalone: !!navigator.standalone, visible: document.visibilityState
  });
  document.addEventListener('visibilitychange', function () { report('/__vis', { state: document.visibilityState }); });
})();
</script>
<script>/*BUNDLE*/</script>
</body>
</html>
